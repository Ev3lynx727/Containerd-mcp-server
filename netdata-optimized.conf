# Memory-optimized Netdata configuration for constrained environments
[db]
    # Use memory mode instead of dbengine for minimal memory usage
    mode = memory
    # Reduce update frequency to reduce memory pressure
    update every = 5
    # Single storage tier for lower memory usage
    storage tiers = 1
    # Disable KSM to save memory
    memory deduplication (ksm) = no

[health]
    # Reduce health check frequency
    run every = 60
    # Disable some health checks that consume memory
    enabled = no

[plugins]
    # Disable memory-intensive plugins
    apps = no
    ebpf = no
    cgroups = no
    # Keep essential plugins
    proc = yes
    diskspace = yes
    network = yes

[web]
    # Use default web mode for proper static file serving
    listen backlog = 10

[registry]
    enabled = no

[statsd]
    enabled = no