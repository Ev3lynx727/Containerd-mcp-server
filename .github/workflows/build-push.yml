name: Build and Push Docker Image

on:
  push:
    branches: [ master, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Convert repository name to lowercase
      run: |
        echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Copy files for Docker build
      run: |
        # Copy necessary files to docker directory for build context
        cp -r mcp-servers docker/
        cp -r mcp-proxy docker/
        cp -r config docker/ 2>/dev/null || mkdir -p docker/config
        
    - name: Verify copied files
      run: |
        echo "Contents of docker/ directory:"
        ls -la docker/
        echo "Contents of docker/mcp-proxy/:"
        ls -la docker/mcp-proxy/ || echo "mcp-proxy not found"

    - name: Build and push main Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./docker
        file: docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Build and push stdio-proxy Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./docker
        file: docker/Dockerfile.stdio-proxy
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-stdio-proxy:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false
