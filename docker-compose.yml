version: '3.8'

services:
  mcp-server:
    build: .
    container_name: mcp-server-container
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/.vscodeserver:/root/.vscode-server
      - mcp-data:/app/data
    env_file:
      - .env  # Optional: create .env file with API keys if needed
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  netdata:
    image: netdata/netdata:latest
    container_name: netdata-container
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    privileged: false
    volumes:
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - ./netdata-optimized.conf:/etc/netdata/netdata.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NETDATA_DISABLE_CGROUP_SWAP_MEMORY=yes
      - NETDATA_UPDATE_EVERY=5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.2'
    restart: unless-stopped

  mcp-netdata-proxy:
    image: ghcr.io/ev3lynx727/containerd-mcp-server-proxy:latest
    container_name: mcp-netdata-proxy-container
    network_mode: host
    depends_on:
      - netdata
    restart: unless-stopped

  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector-container
    network_mode: host
    environment:
      - HOST=0.0.0.0
      - MCP_AUTO_OPEN_ENABLED=false
      - DANGEROUSLY_OMIT_AUTH=true
    restart: unless-stopped

  mcp-stdio-proxy:
    image: ghcr.io/ev3lynx727/containerd-mcp-server-stdio-proxy:latest
    container_name: mcp-stdio-proxy-container
    network_mode: host
    depends_on:
      - mcp-server
    restart: unless-stopped

volumes:
  mcp-data:
  netdata-lib:
  netdata-cache: