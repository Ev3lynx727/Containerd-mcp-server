version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ev3lynx727/containerd-mcp-server:master
    container_name: mcp-server-container
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/.vscodeserver:/root/.vscode-server
      - ~:/home/ev3lynx
      - ./mcp-data:/app/data
      - ./mcp-proxy:/app/proxy
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
      - NODE_PATH=/app/node_modules
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CONTEXT7_API_KEY=${CONTEXT7_API_KEY:-}
    cpu_shares: 1024
    cpus: 4.0
    mem_limit: 4g
    mem_reservation: 1g
    pids_limit: 500
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mcp-stdio-proxy:
    build:
      context: .
      dockerfile: Dockerfile.stdio-proxy
    image: ghcr.io/ev3lynx727/containerd-mcp-server-stdio-proxy:latest
    container_name: mcp-stdio-proxy-container
    network_mode: host
    depends_on:
      - mcp-server
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    cpu_shares: 512
    cpus: 2.0
    mem_limit: 1g
    restart: unless-stopped

volumes:
  mcp-data:
