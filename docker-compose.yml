version: '3.8'

services:
  mcp-server:
    image: ghcr.io/ev3lynx727/containerd-mcp-server:latest
    container_name: mcp-server-container
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/.vscodeserver:/root/.vscode-server
      - mcp-data:/app/data
    env_file:
      - .env  # Optional: create .env file with API keys if needed
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
      - NODE_PATH=/app/node_modules
      - REST_BASE_URL=https://api.example.com
      - AUTH_BEARER=${AUTH_BEARER:-}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  mcp-stdio-proxy:
    image: ghcr.io/ev3lynx727/containerd-mcp-server-stdio-proxy:latest
    container_name: mcp-stdio-proxy-container
    network_mode: host
    depends_on:
      - mcp-server
    restart: unless-stopped

volumes:
  mcp-data: