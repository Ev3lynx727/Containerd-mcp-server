version: '3.8'

services:
  mcp-server:
    image: ghcr.io/ev3lynx727/containerd-mcp-server:main
    container_name: mcp-server-container
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/.vscodeserver:/root/.vscode-server
      - mcp-data:/app/data
    env_file:
      - .env  # Optional: create .env file with API keys if needed
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    restart: unless-stopped

  netdata:
    image: netdata/netdata:latest
    container_name: netdata-container
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    privileged: false
    volumes:
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    restart: unless-stopped

  mcp-netdata-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: mcp-netdata-proxy-container
    network_mode: host
    command: ["--port", "3003"]
    depends_on:
      - netdata
    restart: unless-stopped

volumes:
  mcp-data:
  netdata-lib:
  netdata-cache: