version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ev3lynx727/containerd-mcp-server:master
    container_name: mcp-server-container
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/.vscodeserver:/root/.vscode-server
      - ~:/home/ev3lynx
      - ./mcp-data:/app/data
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
      - NODE_PATH=/app/node_modules
      - REST_BASE_URL=https://api.example.com
      - AUTH_BEARER=${AUTH_BEARER:-}
    cpu_shares: 512
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mcp-stdio-proxy:
    build:
      context: .
      dockerfile: Dockerfile.stdio-proxy
    image: ghcr.io/ev3lynx727/containerd-mcp-server-stdio-proxy:latest
    container_name: mcp-stdio-proxy-container
    network_mode: host
    depends_on:
      - mcp-server
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    cpu_shares: 256
    cpus: 1.0
    mem_limit: 512m
    restart: unless-stopped

volumes:
  mcp-data:
